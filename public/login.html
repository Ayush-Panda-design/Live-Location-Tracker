<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Location Tracker - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #070708;
  --card: #111114;
  --card-border: #1c1c22;

  --input-bg: #18181c;
  --input-border: #2a2a30;
  --focus: #3b82f6;

  --accent: #3b82f6;
  --accent-hover: #2563eb;

  --text-main: #f5f5f5;
  --text-sub: #a1a1aa;
  --placeholder: #6b7280;

  --shadow: 0 30px 80px rgba(0,0,0,0.85);
}

body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg);
  color: var(--text-main);

  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

/* 🔥 premium background lighting */
body::before {
  content: "";
  position: fixed;
  width: 600px;
  height: 400px;
  background: radial-gradient(circle, rgba(59,130,246,0.15), transparent 70%);
  filter: blur(100px);
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 0;
}

.auth-container {
  position: relative;
  z-index: 1;

  width: 100%;
  max-width: 420px;

  background: linear-gradient(180deg, #121216, #0e0e11);
  border: 1px solid var(--card-border);
  border-radius: 18px;

  padding: 42px 34px;

  box-shadow: var(--shadow);
  animation: fadeUp 0.5s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}

/* brand */
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 30px;
}

.brand-icon {
  width: 36px;
  height: 36px;
  background: var(--accent);
  border-radius: 10px;

  display: flex;
  align-items: center;
  justify-content: center;

  box-shadow: 0 8px 20px rgba(59,130,246,0.4);
}

.brand-name {
  font-size: 14px;
  font-weight: 600;
}

/* heading */
h2 {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 6px;
}

.subtitle {
  font-size: 13px;
  color: var(--text-sub);
  margin-bottom: 30px;
}

/* form */
#loginForm {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.field-group label {
  font-size: 11px;
  color: var(--text-sub);
  margin-bottom: 4px;
  letter-spacing: 0.04em;
}

/* inputs */
input {
  width: 100%;
  padding: 13px 14px;

  border-radius: 10px;
  border: 1px solid var(--input-border);
  background: var(--input-bg);

  color: var(--text-main);
  font-size: 14px;

  transition: all 0.25s ease;
}

input::placeholder {
  color: var(--placeholder);
}

input:focus {
  border-color: var(--focus);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.25);
  background: #1c1c21;
}

/* button */
button {
  margin-top: 10px;
  padding: 13px;

  border-radius: 10px;
  border: none;

  background: var(--accent);
  color: white;

  font-weight: 600;
  font-size: 14px;

  cursor: pointer;
  transition: all 0.25s ease;
}

button:hover {
  background: var(--accent-hover);
  transform: translateY(-1px);
  box-shadow: 0 10px 30px rgba(59,130,246,0.4);
}

button:active {
  transform: scale(0.97);
}

/* error */
#errorMsg {
  margin-top: 12px;
  font-size: 13px;
  color: #f87171;
}

/* divider */
.divider {
  height: 1px;
  background: #27272a;
  margin: 24px 0;
}

/* footer */
.auth-footer {
  text-align: center;
  font-size: 13px;
  color: var(--text-sub);
}

.auth-footer a {
  color: var(--accent);
  text-decoration: none;
}

.auth-footer a:hover {
  text-decoration: underline;
}
  </style>
</head>
<body>
  <div class="auth-container">

    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/>
        </svg>
      </div>
      <span class="brand-name">LiveTracker</span>
    </div>

    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to your account to continue</p>

    <form id="loginForm">
      <div class="field-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="e.g. john_doe" required />
      </div>
      <div class="field-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="field-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <button type="submit">Sign in</button>
    </form>

    <p id="errorMsg"></p>

    <div class="divider"></div>

    <p class="auth-footer">Don't have an account? <a href="signup.html">Create one</a></p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        
        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('username', data.username);
          window.location.href = '/';
        } else {
          document.getElementById('errorMsg').innerText = data.error;
        }
      } catch (err) {
        document.getElementById('errorMsg').innerText = 'An error occurred';
      }
    });
  </script>
</body>
</html>
